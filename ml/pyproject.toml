[project]
name = "copiloto-ml"
version = "0.1.0"
description = "Entrenamiento de Claro Copiloto: intención (SVM) y churn (regresión logística), MLflow y drift"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5",
    # Evidently 0.7 importa pandas.core.dtypes.common.infer_dtype_from_object, eliminado en pandas 3.
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "mlflow>=2.17",
    "evidently>=0.4",
    "openai>=1.60",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # ruff 0.17.x termina con access violation en la máquina de demo (Windows 11): se acota.
    "ruff>=0.8,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=copiloto_ml --cov-report=term-missing"
markers = ["insumos: usa los CSV de data/raw (se omite si faltan)"]

[tool.coverage.run]
omit = ["*/copiloto_ml/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
