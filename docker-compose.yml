# Claro Copiloto · entorno local.  Uso:  docker compose up -d
# Requiere .env (copiar de .env.example) y los insumos en data/raw (scripts/bootstrap_data.py).
# Imágenes propias: ${REGISTRY}/<servicio>:${IMAGE_TAG} (local: claro-copiloto/*:local; el despliegue continuo usa
# REGISTRY=ghcr.io/<dueño>/claro-copiloto e IMAGE_TAG=<sha del commit>). COPILOTO_DATOS: carpeta de los insumos.
# Se irán agregando servicios por bloque: api, litellm, ml-service, frontend, observabilidad...

name: claro-copiloto

# Endurecimiento común: sistema de archivos de solo lectura, sin capacidades ni escalamiento de privilegios.
x-endurecido: &endurecido
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [copiloto]

x-mock: &mock
  <<: *endurecido
  build:
    context: ./apps/mocks
  image: ${REGISTRY:-claro-copiloto}/mocks:${IMAGE_TAG:-local}
  environment: &mock-env
    MOCKS_API_KEY: ${MOCKS_API_KEY:?Defina MOCKS_API_KEY en .env}
    MOCKS_FAIL_RATE: ${MOCKS_FAIL_RATE:-0.02}
    MOCKS_RATE_LIMIT_PER_MIN: ${MOCKS_RATE_LIMIT_PER_MIN:-60}
    MOCKS_FECHA_REFERENCIA: ${MOCKS_FECHA_REFERENCIA:-2026-11-18}
  volumes:
    # Datos sintéticos de la prueba (no versionados), solo lectura.
    - ${COPILOTO_DATOS:-./data}/raw/04_apis/datos_mock:/data:ro
  deploy:
    resources:
      limits: { cpus: "0.5", memory: 192M }

# Infraestructura de datos: imágenes oficiales (escriben en sus volúmenes; sin cap_drop porque su
# entrypoint cambia de usuario). Puertos solo en 127.0.0.1, para inspección local.
x-infra: &infra
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  networks: [copiloto]

x-ingesta: &ingesta
  <<: *endurecido
  build:
    context: ./apps/ingestion
  image: ${REGISTRY:-claro-copiloto}/ingesta:${IMAGE_TAG:-local}
  environment: &ingesta-env
    INGESTA_INBOX_DIR: /data/inbox
    INGESTA_REDIS_URL: redis://redis:6379/0
    INGESTA_MONGO_URL: mongodb://mongo:27017
    INGESTA_QDRANT_URL: http://qdrant:6333
  volumes:
    - ${COPILOTO_DATOS:-./data}/inbox:/data/inbox:ro   # carpeta vigilada (en Azure: Blob Storage + Event Grid)
    - modelos:/modelos              # caché del modelo Whisper
  depends_on:
    redis: { condition: service_healthy }
    mongo: { condition: service_healthy }
    qdrant: { condition: service_healthy }

services:
  redis:
    <<: *infra
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-datos:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    <<: *infra
    image: mongo:7.0
    volumes: [mongo-datos:/data/db]
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  qdrant:
    <<: *infra
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: [qdrant-datos:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  litellm:
    <<: *infra
    # Fijado por digest (LiteLLM 1.110.2): build reproducible.
    image: ghcr.io/berriai/litellm@sha256:ef798594ca3db8d81bad2e1439f536f49b71fe095ee9f20416f5e149b4e22035
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY en .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Defina LITELLM_MASTER_KEY en .env}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  ollama:
    # Perfil opcional: docker compose --profile llm-local up -d ollama
    #                  docker compose exec ollama ollama pull llama3.2:3b
    <<: *infra
    image: ollama/ollama:latest
    profiles: ["llm-local"]
    volumes: [ollama-modelos:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]

  mlflow:
    # Tracking + Model Registry (alias staging / produccion). Artefactos servidos por el propio servidor.
    <<: *infra
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
              "--artifacts-destination", "/mlflow/artifacts", "--serve-artifacts",
              "--workers", "1",
              "--allowed-hosts", "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"]
    environment:
      # Medido: 2,25 GB de RAM. El servidor de MLflow 3 arranca 8 consumidores de trabajos GenAI (huey, ~210 MB
      # c/u) que este proyecto no usa: se desactivan, y un solo worker web basta para el registry local.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    volumes: [mlflow-datos:/mlflow]
    ports: ["127.0.0.1:5000:5000"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  ml-service:
    <<: *endurecido
    build:
      context: ./apps/ml-service
    image: ${REGISTRY:-claro-copiloto}/ml-service:${IMAGE_TAG:-local}
    environment:
      ML_MLFLOW_TRACKING_URI: http://mlflow:5000
      ML_MONGO_URL: mongodb://mongo:27017
      ML_FECHA_REFERENCIA: ${MOCKS_FECHA_REFERENCIA:-2026-11-18}
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      mlflow: { condition: service_healthy }
      mongo: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  # ------------------------------------------------------------ observabilidad y RPA ------
  phoenix:
    # Trazas del agente (OpenTelemetry/OpenInference): http://localhost:6006
    <<: *infra
    image: arizephoenix/phoenix:version-22.0.1
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_TELEMETRY_ENABLED: "false"
      # Phoenix 22 exige autenticación si escucha fuera de loopback. Local: puerto solo en 127.0.0.1, sin auth.
      # Producción: PHOENIX_ENABLE_AUTH=true + PHOENIX_SECRET y API key en la cabecera del exportador OTLP.
      PHOENIX_ENABLE_AUTH: "false"
    volumes: [phoenix-datos:/mnt/data]
    ports: ["127.0.0.1:6006:6006"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  prometheus:
    # Métricas y reglas de alerta: http://localhost:9090
    <<: *infra
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=15d", "--web.enable-lifecycle"]
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-datos:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  alertmanager:
    # Enruta las alertas a n8n: http://localhost:9093
    <<: *infra
    image: prom/alertmanager:v0.35.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./infra/observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-datos:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  grafana:
    # Tableros provisionados como código: http://localhost:3000 (lectura anónima; admin con GRAFANA_ADMIN_PASSWORD)
    <<: *infra
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD en .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/copiloto-agente.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-datos:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  n8n:
    # RPA: acción confirmada → ERP, escalamiento → notificación, alertas → acción. UI: http://localhost:5678
    # Los flujos se importan (y activan) desde infra/n8n/flujos en cada arranque: versionados en Git.
    <<: *infra
    image: n8nio/n8n:2.49.3
    entrypoint: ["/bin/sh", "-c"]
    # En modo estándar la activación es con publish:workflow (import --activeState solo aplica en modo cola).
    command: ["n8n import:workflow --separate --input=/flujos
               && for id in CopilotoAccionERP CopilotoEscalamien CopilotoAlertasAcc; do n8n publish:workflow --id=$$id; done
               && exec n8n start"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY en .env}
      MOCKS_API_KEY: ${MOCKS_API_KEY:?Defina MOCKS_API_KEY en .env}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # los flujos leen MOCKS_API_KEY del entorno (no en el JSON)
      N8N_METRICS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"              # solo localhost por HTTP
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      NODE_OPTIONS: --max-old-space-size=768  # con 512 MB el primer arranque (migraciones) agotaba el heap
    volumes:
      - ./infra/n8n/flujos:/flujos:ro
      - n8n-datos:/home/node/.n8n
    ports: ["127.0.0.1:5678:5678"]
    depends_on:
      erp-mock: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  ingesta-watcher:
    <<: *ingesta
    command: ["python", "-m", "ingesta", "watcher"]
    environment:
      <<: *ingesta-env
      INGESTA_ROL: watcher
      INGESTA_POLL_S: ${INGESTA_POLL_S:-3}
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  ingesta-worker:
    <<: *ingesta
    command: ["python", "-m", "ingesta", "worker"]
    environment:
      <<: *ingesta-env
      INGESTA_ROL: worker
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY en .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      INGESTA_WHISPER_MODELO: ${INGESTA_WHISPER_MODELO:-small}
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 3G }   # Whisper small + spaCy

  api:
    <<: *endurecido
    build:
      context: ./apps/api
    image: ${REGISTRY:-claro-copiloto}/api:${IMAGE_TAG:-local}
    environment:
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-480}
      API_DEMO_PASSWORD: ${API_DEMO_PASSWORD:?Defina API_DEMO_PASSWORD en .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Defina LITELLM_MASTER_KEY en .env}
      MCP_CONFIRMACION_SECRET: ${MCP_CONFIRMACION_SECRET:?Defina MCP_CONFIRMACION_SECRET en .env}
      MCP_CONFIRMACION_TTL_S: ${MCP_CONFIRMACION_TTL_S:-300}
      API_LLM_BASE_URL: http://litellm:4000/v1
      API_QDRANT_URL: http://qdrant:6333
      API_MCP_URL: http://mcp-server:8090/mcp
      API_ML_URL: http://ml-service:8001
      API_OTEL_ENDPOINT: http://phoenix:6006       # trazas OpenTelemetry → Phoenix
      API_N8N_URL: http://n8n:5678/webhook          # eventos de negocio → flujos RPA
      API_REDIS_URL: redis://redis:6379/1
      API_MONGO_URL: mongodb://mongo:27017
      API_RERANKER_ACTIVO: ${API_RERANKER_ACTIVO:-false}
      API_RATE_LIMIT_POR_MIN: ${API_RATE_LIMIT_POR_MIN:-30}
    volumes:
      - modelos:/modelos              # caché del reranker (si se activa)
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      litellm: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      mcp-server: { condition: service_healthy }
      ml-service: { condition: service_started }   # sin él la API sigue con reglas / clasificador LLM
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }

  frontend:
    # Interfaz del asesor y del supervisor: http://localhost:8080 (Nginx reenvía /api → api:8000)
    <<: *endurecido
    build:
      context: ./apps/frontend
    image: ${REGISTRY:-claro-copiloto}/frontend:${IMAGE_TAG:-local}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64M }

  mcp-server:
    <<: *endurecido
    build:
      context: ./apps/mcp-server
    image: ${REGISTRY:-claro-copiloto}/mcp-server:${IMAGE_TAG:-local}
    environment:
      MCP_CRM_URL: http://crm-mock:8081/v1
      MCP_FACTURACION_URL: http://facturacion-mock:8082/v1
      MCP_MOCKS_API_KEY: ${MOCKS_API_KEY:?Defina MOCKS_API_KEY en .env}
      MCP_CONFIRMACION_SECRET: ${MCP_CONFIRMACION_SECRET:?Defina MCP_CONFIRMACION_SECRET en .env}
      MCP_CONFIRMACION_TTL_S: ${MCP_CONFIRMACION_TTL_S:-300}
      MCP_FECHA_REFERENCIA: ${MOCKS_FECHA_REFERENCIA:-2026-11-18}
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      crm-mock: { condition: service_healthy }
      facturacion-mock: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }

  crm-mock:
    <<: *mock
    environment:
      <<: *mock-env
      MOCKS_SERVICIO: crm
    ports: ["127.0.0.1:8081:8081"]

  facturacion-mock:
    <<: *mock
    environment:
      <<: *mock-env
      MOCKS_SERVICIO: facturacion
    ports: ["127.0.0.1:8082:8082"]

  erp-mock:
    <<: *mock
    environment:
      <<: *mock-env
      MOCKS_SERVICIO: erp
    ports: ["127.0.0.1:8083:8083"]

networks:
  copiloto:
    name: claro-copiloto

volumes:
  redis-datos:
  mongo-datos:
  qdrant-datos:
  modelos:
  ollama-modelos:
  mlflow-datos:
  phoenix-datos:
  prometheus-datos:
  alertmanager-datos:
  grafana-datos:
  n8n-datos:
