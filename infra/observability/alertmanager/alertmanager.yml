# Alertmanager → n8n (flujo "Alertas → acción"). En producción: también Teams/correo/PagerDuty.
route:
  receiver: n8n
  group_by: [alertname, modelo]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: n8n
    webhook_configs:
      - url: http://n8n:5678/webhook/alertas
        send_resolved: true
