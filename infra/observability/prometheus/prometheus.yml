# Prometheus local (en Azure: Azure Monitor managed Prometheus + Managed Grafana).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api              # agente: turnos, latencia, costo, tools, bloqueos, escalamientos, feedback
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: ml-service       # inferencias, confianza del SVM, PSI de drift
    static_configs: [{ targets: ["ml-service:8001"] }]
  - job_name: ingesta          # frescura, resultados, cola y dead-letter
    static_configs: [{ targets: ["ingesta-worker:9101"] }]
  - job_name: n8n              # ejecuciones de los flujos RPA
    static_configs: [{ targets: ["n8n:5678"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
