# Despliegue continuo en la máquina de demo (SAD 2.13): imágenes de GHCR por SHA → gates → rollback si fallan.
#
# Corre en un self-hosted runner (Windows, etiqueta `claro-demo`) que tiene Docker, el .env y los insumos.
# Salvaguardas (el repo es público; ver docs/04_ci_cd.md):
#   - solo se dispara por un CI exitoso de un PUSH a main o a mano (nunca por PRs);
#   - ambiente `demo` de GitHub (se le pueden exigir aprobadores);
#   - el runner se inicia a mano durante la demo (run.cmd), no como servicio;
#   - en GitHub: Settings → Actions → "Require approval for all external contributors".
name: CD (máquina de demo)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit a desplegar (vacío = el último de main con imágenes publicadas)"
        required: false
      golden:
        description: "Correr el golden con el LLM real como gate (~US$ 0,08)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: despliegue-demo
  cancel-in-progress: false

jobs:
  desplegar:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, windows, claro-demo]
    environment: demo
    timeout-minutes: 40
    env:
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      GOLDEN: ${{ github.event_name == 'workflow_run' || inputs.golden }}
      COMPOSE_PROJECT_NAME: claro-copiloto
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      # Windows PowerShell 5.1: lee los scripts de los pasos como ANSI y Out-File -Encoding utf8 escribe BOM
      # (vistos en el primer despliegue: tildes rotas en el resumen). Por eso los scripts son solo ASCII
      # (tildes del resumen como entidades HTML) y GITHUB_ENV/OUTPUT/SUMMARY se escriben con AppendAllText (sin BOM).
      - name: Configuración local del runner (.env e insumos fuera del repo)
        run: |
          # Variables de la maquina (archivo .env del runner): COPILOTO_ENV_FILE y COPILOTO_DATOS
          if (-not (Test-Path $env:COPILOTO_ENV_FILE)) { throw "Falta COPILOTO_ENV_FILE en el runner" }
          if (-not (Test-Path "$env:COPILOTO_DATOS\raw\04_apis")) { throw "Faltan los insumos en COPILOTO_DATOS" }
          Copy-Item $env:COPILOTO_ENV_FILE .env    # se borra al final (paso Limpieza)
          $owner = "${{ github.repository_owner }}".ToLower()
          $inicio = (Get-Date).ToUniversalTime().ToString('o')
          [IO.File]::AppendAllText($env:GITHUB_ENV, "REGISTRY=ghcr.io/$owner/claro-copiloto`nIMAGE_TAG=$env:SHA`nT_INICIO=$inicio`n")

      - name: Versión en ejecución (para el rollback)
        id: previa
        run: |
          $imagen = docker inspect claro-copiloto-api-1 --format '{{.Config.Image}}' 2>$null
          if ($LASTEXITCODE -eq 0 -and $imagen) {
            $registro, $tag = $imagen -replace '/api:', '|' -split '\|'
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "registry=$registro`ntag=$tag`n")
            Write-Output "En ejecucion: $imagen"
          } else { Write-Output "No hay una version previa en ejecucion" }
          exit 0

      - name: Descargar imágenes del commit desde GHCR
        run: |
          # Paquetes publicos (repo publico): descarga anonima. Con PowerShell 5.1, `$token | docker login
          # --password-stdin` agrega CRLF al token y GHCR responde "denied" (primer despliegue).
          Write-Output "Imagenes: $env:REGISTRY/*:$env:IMAGE_TAG"
          docker compose pull crm-mock facturacion-mock erp-mock mcp-server ingesta-watcher ingesta-worker api ml-service frontend
          exit $LASTEXITCODE

      - name: Gate de ML (F1 intención ≥ 0,80 · AUC churn ≥ 0,65 sobre el corpus real)
        run: |
          # Pruebas de ml/ con los CSV reales (no versionados): reproduce los hallazgos y el gate del SAD.
          # Codigo de solo lectura y entorno virtual dentro del contenedor: nunca toca un .venv del host.
          docker run --rm -v "${PWD}\ml:/ml:ro" -v "$env:COPILOTO_DATOS\raw\03_datos:/data/raw/03_datos:ro" `
            -v uv-cache-ci:/root/.cache/uv -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_LINK_MODE=copy -w /ml `
            ghcr.io/astral-sh/uv:0.13.9-python3.12-trixie-slim `
            sh -c "uv sync --frozen -q && uv run --frozen pytest -q -p no:cacheprovider -k corpus_real --no-cov"
          exit $LASTEXITCODE

      - name: Desplegar (healthchecks)
        run: |
          docker compose up -d --no-build --wait --wait-timeout 300
          exit $LASTEXITCODE

      - name: Smoke · API de punta a punta
        run: |
          py -3.13 scripts/smoke_api.py
          exit $LASTEXITCODE

      - name: Smoke · observabilidad y RPA
        run: |
          py -3.13 scripts/smoke_observabilidad.py
          exit $LASTEXITCODE

      - name: Gate golden (8 KPIs con el LLM real)
        if: env.GOLDEN == 'true'
        run: |
          py -3.13 eval/correr_golden.py
          $codigo = $LASTEXITCODE
          $reporte = Get-ChildItem eval\reportes\golden_*.md | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($reporte) {
            $texto = [IO.File]::ReadAllText($reporte.FullName, [Text.Encoding]::UTF8)
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "`n$texto`n")
          }
          exit $codigo

      - name: Rollback a la versión anterior
        if: failure() && steps.previa.outputs.tag != ''
        run: |
          Write-Output "Fallo un gate: vuelvo a ${{ steps.previa.outputs.registry }}/*:${{ steps.previa.outputs.tag }}"
          $env:REGISTRY = "${{ steps.previa.outputs.registry }}"
          $env:IMAGE_TAG = "${{ steps.previa.outputs.tag }}"
          docker compose up -d --no-build --wait --wait-timeout 300
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.13 scripts/smoke_api.py
          $sha = $env:SHA.Substring(0, 7)
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "## &#9888;&#65039; Rollback a ``$env:IMAGE_TAG`` (fall&oacute; un gate de ``$sha``)`n")
          exit 1

      - name: Lead time (commit → desplegado y validado)
        if: success()
        run: |
          $commit = [datetime]::Parse((git show -s --format=%cI $env:SHA)).ToUniversalTime()
          $ahora = (Get-Date).ToUniversalTime()
          $minutos = [math]::Round(($ahora - $commit).TotalMinutes, 1)
          $despliegue = [math]::Round(($ahora - [datetime]::Parse($env:T_INICIO).ToUniversalTime()).TotalMinutes, 1)
          $meta = if ($minutos -lt 30) { "&#9989;" } else { "&#10060;" }
          $sha = $env:SHA.Substring(0, 7)
          $filas = @(
            "## Despliegue ``$sha``", "",
            "| Indicador | Valor | Meta |", "|---|---|---|",
            "| Lead time (commit &rarr; desplegado y validado) | $minutos min | &lt; 30 min $meta |",
            "| Despliegue + gates | $despliegue min | |", ""
          )
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($filas -join "`n"))

      - name: Limpieza
        if: always()
        run: |
          Remove-Item .env -Force -ErrorAction SilentlyContinue
          exit 0
