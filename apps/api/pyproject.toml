[project]
name = "copiloto-api"
version = "0.1.0"
description = "API y agente de Claro Copiloto: LangGraph, RAG híbrido con reranking, guardrails, memoria y confirmación de acciones"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "openai>=1.60",
    "qdrant-client>=1.13",
    "fastembed>=0.5",
    "fastmcp>=2.12",
    "redis>=5.2",
    "pymongo>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "fakeredis>=2.26",
    "mongomock>=4.3",
    "httpx>=0.28",
    # ruff 0.17.x termina con access violation en la máquina de demo (Windows 11): se acota.
    "ruff>=0.8,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=copiloto_api --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/copiloto_api/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
