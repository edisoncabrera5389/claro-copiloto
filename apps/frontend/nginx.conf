# Nginx sin privilegios (uid 101, puerto 8080) con sistema de archivos de solo lectura:
# pid y temporales en /tmp (tmpfs en docker-compose).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 64k;

  # Sin cuerpo ni query string en el log: pueden traer datos del cliente (Ley 1581).
  log_format sin_pii '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout sin_pii;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API_UPSTREAM: api:8000 en docker compose; api:80 en Azure Container Apps (ingress interno por nombre).
  upstream api { server ${API_UPSTREAM}; }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Métricas solo para Prometheus (red interna), nunca hacia el navegador.
    location = /api/metrics { return 404; }

    # API: mismo origen (sin CORS). SSE sin buffer para que los tokens lleguen al instante.
    location /api/ {
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;   # "api": el Envoy de Container Apps enruta por Host
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 120s;
    }

    # Archivos con hash: caché larga. index.html: siempre fresco (despliegues sin caché vieja).
    location ~* \.(js|css|woff2?|ico|svg|png)$ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options nosniff always;
    }
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
    }
  }
}
