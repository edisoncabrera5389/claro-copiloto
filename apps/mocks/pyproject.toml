[project]
name = "claro-mocks"
version = "0.1.0"
description = "Servicios simulados CRM, Facturación y ERP de Claro Copiloto (fieles a los contratos OpenAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    # ruff 0.17.x termina con access violation en la máquina de demo (Windows 11): se acota.
    "ruff>=0.8,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=mocks --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/mocks/__main__.py", "*/mocks/healthcheck.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
