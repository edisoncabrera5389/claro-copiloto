[project]
name = "copiloto-ml-service"
version = "0.1.0"
description = "Servicio de modelos de Claro Copiloto: intención, riesgo de churn y drift (PSI), cargados desde MLflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "mlflow-skinny==3.18.0",
    "skops==0.16.0",
    # Mismas versiones con las que se entrenó (ml/uv.lock): un modelo sklearn no se carga con otra versión.
    "scikit-learn==1.9.1",
    "pandas==2.3.3",
    "numpy==2.5.5",
    "pymongo>=4.10",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "mongomock>=4.3",
    # ruff 0.17.x termina con access violation en la máquina de demo (Windows 11): se acota.
    "ruff>=0.8,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto_ml_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=copiloto_ml_service --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/copiloto_ml_service/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
